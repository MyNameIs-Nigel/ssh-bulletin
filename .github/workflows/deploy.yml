name: Deploy Bulletin

on:
  workflow_call:
    inputs:
      digest:
        required: true
        type: string
      version:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      INSTANCE_ID: ${{ vars.ARCADE_INSTANCE_ID }}
      DEPLOY_ROLE: ${{ vars.ARCADE_DEPLOY_ROLE }}
      DIGEST: ${{ inputs.digest }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate deployment settings
        run: |
          if [[ -z "$DEPLOY_ROLE" || ! "$INSTANCE_ID" =~ ^i-([0-9a-f]{8}|[0-9a-f]{17})$ ]]; then
            echo "::error::Set ARCADE_DEPLOY_ROLE and ARCADE_INSTANCE_ID before enabling deployment"
            exit 1
          fi
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: us-east-1
      - name: Roll out the approved digest through SSM
        run: |
          set -euo pipefail
          image="ghcr.io/mynameis-nigel/ssh-bulletin@$DIGEST"
          params="$RUNNER_TEMP/bulletin-ssm-params.json"
          jq -n --arg script "$(base64 -w0 scripts/deploy/remote-deploy.sh)" \
            --arg image "$image" --arg version "$VERSION" \
            '{executionTimeout: ["1500"], commands: [
              "set -eu",
              "script=$(mktemp)",
              "trap \"rm -f $script\" EXIT",
              "printf %s \($script) | base64 -d > \"$script\"",
              "IMAGE=\($image) VERSION=\($version) sh \"$script\""
            ]}' > "$params"
          command_id=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript --timeout-seconds 120 \
            --comment "deploy bulletin $VERSION" --parameters "file://$params" \
            --query Command.CommandId --output text)
          {
            echo "Release v$VERSION"
            echo
            echo "- Image \`$image\`"
            echo "- SSM command \`$command_id\`"
          } >> "$GITHUB_STEP_SUMMARY"
          result="$RUNNER_TEMP/bulletin-ssm-result.json"
          status=Pending
          deadline=$((SECONDS + 1700))
          while (( SECONDS < deadline )); do
            if aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" --cli-connect-timeout 5 --cli-read-timeout 10 \
              --query '{Status:Status,Out:StandardOutputContent,Err:StandardErrorContent}' \
              --output json > "$result"; then
              status=$(jq -er .Status "$result")
              case "$status" in
                Success|Cancelled|TimedOut|Failed)
                  cat "$result"
                  break
                  ;;
              esac
            fi
            sleep 10
          done
          echo "- SSM status $status" >> "$GITHUB_STEP_SUMMARY"
          test "$status" = Success
