name: Release

on:
  release:
    types: [published]

concurrency:
  group: release-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/mynameis-nigel/ssh-bulletin

jobs:
  release:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - id: release
        name: Validate release tag and main ancestry
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tag must be vMAJOR.MINOR.PATCH"
            exit 1
          fi
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

  verify:
    needs: release
    uses: ./.github/workflows/verify.yml
    with:
      test-count: 2
      build-image: false # publish builds it for real

  publish:
    name: publish image
    needs: [release, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write # provenance attestation
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "sha_short=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          labels: |
            org.opencontainers.image.version=v${{ needs.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            VERSION=${{ needs.release.outputs.version }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
      - name: Smoke-test and scan the candidate digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          image="$IMAGE_NAME@$DIGEST"
          docker pull --platform linux/amd64 "$image"
          scripts/ci/smoke-image.sh "$image" "$VERSION"
          archive="$RUNNER_TEMP/bulletin-image.tar"
          docker save -o "$archive" "$image"
          docker run --rm --mount "type=bind,src=$archive,dst=/image.tar,readonly" \
            ghcr.io/aquasecurity/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
            image --input /image.tar --scanners vuln --no-progress \
            --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Tag the approved digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ needs.release.outputs.version }}
          SHA_TAG: ${{ steps.meta.outputs.sha_short }}
        run: |
          for tag in "v$VERSION" "$SHA_TAG" latest; do
            docker buildx imagetools create --prefer-index=false --tag "$IMAGE_NAME:$tag" "$IMAGE_NAME@$DIGEST"
            manifest=$(docker buildx imagetools inspect "$IMAGE_NAME:$tag" --format '{{json .Manifest}}')
            test "$(jq -er .digest <<< "$manifest")" = "$DIGEST"
          done

  deploy:
    needs: [release, publish]
    if: vars.ARCADE_DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      digest: ${{ needs.publish.outputs.digest }}
      version: ${{ needs.release.outputs.version }}
