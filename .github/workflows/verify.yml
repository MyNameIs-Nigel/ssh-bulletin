name: Verify

# The test contract, defined once and called by both CI and Release, so the
# gate on main can never drift weaker than the gate on branches.

on:
  workflow_call:
    inputs:
      test-count:
        type: number
        default: 2
      build-image:
        description: Build the container image (without pushing it).
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  static:
    name: static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean"
            echo "$unformatted" | sed 's/^/  /'
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go.mod is tidy
        run: go mod tidy -diff
      - name: module checksums verify
        run: go mod verify
      - name: build
        run: go build ./...

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: test -race -shuffle=on
        run: go test -race -count=${{ inputs.test-count }} -shuffle=on ./...
      - name: working tree is unchanged
        run: |
          if ! git diff --exit-code; then
            echo "::error::the test run modified tracked files"
            exit 1
          fi

  image:
    name: image builds
    if: ${{ inputs.build-image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          build-args: |
            VERSION=0.0.0-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
