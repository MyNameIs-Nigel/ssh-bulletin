name: Verify

# The test contract, defined once and called by both CI and Release, so the
# gate on main can never drift weaker than the gate on branches.

on:
  workflow_call:
    inputs:
      test-count:
        type: number
        default: 2
      build-image:
        description: Build and smoke-test the container without publishing it.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  static:
    name: static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            build/litestream/go.sum
      - name: Check workflows
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$RUNNER_TEMP/bin/actionlint"
      - name: Check rollout scripts
        run: |
          shellcheck entrypoint.sh scripts/ci/smoke-image.sh scripts/deploy/remote-deploy.sh
          python3 scripts/deploy/test_deploy.py
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean"
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go.mod is tidy
        run: go mod tidy -diff
      - name: module checksums verify
        run: go mod verify
      - name: Verify Litestream module checksums
        working-directory: build/litestream
        run: go mod verify
      - name: build
        run: go build ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # only-new-issues needs the merge base
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          # A ratchet, as in ssh-farm: new and changed code must be clean, and
          # the existing backlog (27 findings when this was added) is visible
          # but does not block. `golangci-lint run ./...` lists it.
          only-new-issues: true
        continue-on-error: ${{ github.event_name != 'pull_request' }}

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: test -race -shuffle=on
        run: go test -race -count=${{ inputs.test-count }} -shuffle=on ./...
      - name: working tree is unchanged
        run: |
          if ! git diff --exit-code; then
            echo "::error::the test run modified tracked files"
            exit 1
          fi

  image:
    name: container smoke test
    if: ${{ inputs.build-image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          provenance: false
          tags: ssh-bulletin:ci
          build-args: |
            VERSION=0.0.0-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: scripts/ci/smoke-image.sh ssh-bulletin:ci 0.0.0-ci
